name: exam_app
description: "A new Flutter project."
publish_to: "none"

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dart_either: ^2.1.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_bloc_effects: ^1.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  injectable: ^2.7.1+4
  json_annotation: ^4.9.0
  pinput: ^6.0.2
  retrofit: ^4.9.0
  skeletonizer: ^2.1.3
  

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/values/
  filename: images_paths.dart
  ignore_comments: true
