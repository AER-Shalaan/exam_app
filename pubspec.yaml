name: exam_app
description: "A new Flutter project."
publish_to: "none"

environment:
  sdk: ^3.11.0

dependencies:
  bloc: ^9.2.0
  cupertino_icons: ^1.0.8
  dart_either: ^2.1.0
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  get_it: null
  google_fonts: ^8.0.2
  injectable: null
  json_annotation: ^4.9.0

  retrofit: ^4.9.0

dev_dependencies:
  build_runner: null
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: null
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/values/
  filename: images_paths.dart
  ignore_comments: true
