name: exam_app
description: "A new Flutter project."
publish_to: "none"

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/values/
  filename: images_paths.dart
  ignore_comments: true
